name: ci

# Overlay CI for the scx_flow scheduler.
#
# The scheduler in scx/ is a drop-in for scheds/experimental/scx_flow/
# in an upstream sched-ext/scx checkout (path deps use ../../../rust),
# so every job first assembles that workspace, syncs the overlay
# lock entry, and then runs the usual package-scoped checks inside
# it. No live scheduler run: GitHub
# runners do not provide a sched_ext-enabled kernel, so only unit
# tests plus a --version smoke check run here.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -x {0}

env:
  PS4: '+ $(date "+%H:%M:%S") '
  BPF_CLANG: clang-19
  RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # Pinned upstream workspace ref (sched-ext/scx main as of 2026-09-15).
  # Bump deliberately after verifying the overlay still builds; the
  # overlay needs scx_* 1.1.3 + libbpf-rs 0.27.1 from the workspace.
  SCX_REF: 6752d59a4297d8918e8fd4d7237b50e2fceb1d14

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config lld clang clang-19 llvm-19 \
            libbpf-dev libelf-dev libzstd-dev protobuf-compiler \
            libseccomp-dev libcap-ng-dev stress-ng mold
          echo /usr/lib/llvm-19/bin >> $GITHUB_PATH
      - name: Assemble the scheduler workspace
        run: |
          git init -q /tmp/opencode/scx
          git -C /tmp/opencode/scx remote add origin https://github.com/sched-ext/scx
          git -C /tmp/opencode/scx fetch --depth 1 origin "${SCX_REF}"
          git -C /tmp/opencode/scx checkout FETCH_HEAD
          # Upstream already ships scheds/experimental/scx_flow, so
          # replace it instead of merging into it.
          rsync -a --delete --exclude /target/ scx/ /tmp/opencode/scx/scheds/experimental/scx_flow/
          rm -f /tmp/opencode/scx/scheds/experimental/scx_flow/LICENSE
          ln -s ../../../LICENSE /tmp/opencode/scx/scheds/experimental/scx_flow/LICENSE
          grep -q '"scheds/experimental/scx_flow"' /tmp/opencode/scx/Cargo.toml
      - name: Sync overlay lockfile
        working-directory: /tmp/opencode/scx
        run: cargo update -p scx_flow
      - name: Format
        working-directory: /tmp/opencode/scx
        run: cargo fmt -p scx_flow --check
      - name: Clippy
        working-directory: /tmp/opencode/scx
        run: cargo clippy --profile ci --no-deps --locked -p scx_flow -- -Dwarnings
      - name: Build
        working-directory: /tmp/opencode/scx
        run: cargo build --profile ci --locked -p scx_flow
      - name: Unit tests
        working-directory: /tmp/opencode/scx
        run: cargo test --profile ci --locked -p scx_flow
      - name: Smoke test (no kernel needed)
        working-directory: /tmp/opencode/scx
        run: |
          target/ci/scx_flow --version
          target/ci/scx_flow --help > /dev/null

  veristat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config lld clang clang-19 llvm-19 \
            libbpf-dev libelf-dev libzstd-dev protobuf-compiler \
            libseccomp-dev libcap-ng-dev mold
          echo /usr/lib/llvm-19/bin >> $GITHUB_PATH
      - name: Assemble the scheduler workspace
        run: |
          git init -q /tmp/opencode/scx
          git -C /tmp/opencode/scx remote add origin https://github.com/sched-ext/scx
          git -C /tmp/opencode/scx fetch --depth 1 origin "${SCX_REF}"
          git -C /tmp/opencode/scx checkout FETCH_HEAD
          # Upstream already ships scheds/experimental/scx_flow, so
          # replace it instead of merging into it.
          rsync -a --delete --exclude /target/ scx/ /tmp/opencode/scx/scheds/experimental/scx_flow/
          rm -f /tmp/opencode/scx/scheds/experimental/scx_flow/LICENSE
          ln -s ../../../LICENSE /tmp/opencode/scx/scheds/experimental/scx_flow/LICENSE
          grep -q '"scheds/experimental/scx_flow"' /tmp/opencode/scx/Cargo.toml
      - name: Sync overlay lockfile
        working-directory: /tmp/opencode/scx
        run: cargo update -p scx_flow
      - name: Install veristat tools
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/libbpf/veristat /tmp/veristat
          make -C /tmp/veristat/src -j$(nproc)
          sudo cp /tmp/veristat/src/veristat /usr/local/bin/
          sudo setcap cap_bpf,cap_perfmon+ep /usr/local/bin/veristat
          cargo install cargo-veristat --locked
      - name: Build and verify
        working-directory: /tmp/opencode/scx
        run: |
          cargo build --profile ci --locked -p scx_flow
          cargo metadata --format-version 1 > /tmp/meta.json
          cargo veristat --profile ci --metadata-json /tmp/meta.json \
            --no-build scx_flow
