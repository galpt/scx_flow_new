  Flow web UI. A live view of per CPU queues,
  per CPU running tasks and system counters, served by
  the dashboard server over loopback with a unix socket
  fallback. Offline first with no external assets.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />
  <title>scx_flow stats</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --elevated: #111111;
      --border: #1a1a1a;
      --border-hover: #333333;
      --text-primary: #ededed;
      --text-secondary: #888888;
      --text-muted: #6a6a6a;
      --accent: #3f83f8;
      --success: #31c48d;
      --warning: #f5a623;
      --error: #ee0000;
      --font-sans: system-ui, -apple-system,
        "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "Cascadia Mono",
        "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      padding: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    @media (min-width: 640px) {
      body { padding: 24px; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-width: 0;
      overflow: hidden;
    }
    .stat-value {
      font-family: var(--font-mono);
      font-weight: 600;
      font-feature-settings: "tnum";
    }
    /* Per CPU card grid. Dense chips in a wrapping
     * grid with a bounded height and an internal
     * scroll, so a many core machine never
     * stretches the page. */
    .core-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(148px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
    }
    .core-card { padding: 8px; font-size: 0.75rem; }
    .core-card .core-id {
      font-size: 0.6875rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .core-card .core-freq {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      margin-top: 1px;
    }
    .core-card .core-smt {
      font-size: 0.625rem;
      color: var(--warning);
    }
    .core-card .core-llc {
      font-size: 0.625rem;
      color: var(--text-muted);
    }
    .core-card .core-pid {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .core-card .core-est {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 1px;
    }
    .core-card .core-tq {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 1px;
    }
    .core-card .core-depth {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 1px;
    }
    /* Running badge on each CPU card. Running tasks
     * show live, idle cards stay muted. */
    .run-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--border-hover);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
    }
    .run-idle { color: var(--text-muted); }
    .run-live {
      color: var(--success);
      border-color: var(--success);
    }
    /* Summary card */
    .summary-tldr {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--success);
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .summary-explanation {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .section-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .subsection-label {
      font-size: 0.6875rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    /* System stats grid */
    .sys-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 0.8125rem;
    }
    @media (min-width: 640px) {
      .sys-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .card { padding: 10px; }
      .stat-value {
        font-size: 0.875rem !important;
        word-break: break-all;
      }
      .core-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div style="max-width:1152px;margin:auto">

    <!-- Header -->
    <header class="card" style="margin-bottom:16px;display:flex;
      align-items:center;justify-content:space-between;
      gap:12px;">
      <div style="min-width:0;overflow:hidden">
        <h1 style="font-size:1.25rem;font-weight:700">
          scx_flow stats
        </h1>
        <p style="font-size:0.8125rem;
          color:var(--text-secondary);margin-top:2px">
          per CPU queues, mean slices and placement
        </p>
      </div>
      <div id="status-badge" style="font-size:0.75rem;
        padding:3px 10px;border-radius:999px;
        border:1px solid var(--success);
        color:var(--success);
        font-family:var(--font-mono);white-space:nowrap">
        ● running
      </div>
    </header>

    <!-- Per CPU cards -->
    <div id="core-cards" class="core-grid"></div>

    <!-- Summary -->
    <div class="card" style="margin-bottom:16px">
      <p class="section-label">Summary</p>
      <p class="subsection-label">TL;DR</p>
      <p class="summary-tldr" id="summary-tldr">
        Loading...
      </p>
      <p class="subsection-label">Explanation</p>
      <p class="summary-explanation"
        id="summary-explanation"></p>
    </div>

    <!-- System stats -->
    <div class="card">
      <p class="section-label">System</p>
      <div class="sys-grid">
        <div><span style="color:var(--text-muted)">
          On CPU:</span>
          <span class="stat-value" id="on-cpu">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Uptime:</span>
          <span class="stat-value" id="uptime">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Runtime:</span>
          <span class="stat-value" id="runtime">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Inserts:</span>
          <span class="stat-value" id="inserts">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Requeues:</span>
          <span class="stat-value" id="requeues">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Completions:</span>
          <span class="stat-value" id="completions">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Park moves:</span>
          <span class="stat-value" id="park">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Steal moves:</span>
          <span class="stat-value" id="steal">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          Kicks:</span>
          <span class="stat-value" id="kicks">0</span>
        </div>
        <div><span style="color:var(--text-muted)">
          No task state:</span>
          <span class="stat-value" id="no-tctx">0</span>
        </div>
      </div>
    </div>

    <!-- Connection status -->
    <div style="text-align:center;margin-top:16px">
      <p style="font-size:0.75rem;color:var(--text-muted)"
        id="conn-status">Loading...</p>
    </div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);

    function clamp(v) { return v < 0 ? 0 : v; }

    /* Compact counter form, same shape as the
     * system table values. */
    function fmt(n) {
      n = clamp(n);
      if (n >= 1e15) return (n / 1e15).toFixed(2) + 'Q';
      if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toLocaleString();
    }

    /* Nanoseconds as a wall clock duration for the
     * uptime and runtime gauges. */
    function fmtRuntime(ns) {
      ns = clamp(ns);
      var sec = ns / 1e9;
      if (sec < 60) return sec.toFixed(1) + ' sec';
      var min = sec / 60;
      if (min < 60) return min.toFixed(1) + ' min';
      var hr = min / 60;
      if (hr < 24) return hr.toFixed(1) + ' hr';
      var day = hr / 24;
      return day.toFixed(1) + ' days';
    }

    /* Slice in nanos. Below a microsecond stays in
     * ns, below a millisecond shows us, above
     * shows ms. */
    function fmtSlice(ns) {
      ns = clamp(ns);
      if (ns >= 1e6) return (ns / 1e6).toFixed(2) + ' ms';
      if (ns >= 1e3) return (ns / 1e3).toFixed(1) + ' us';
      return Math.round(ns) + ' ns';
    }

    /* Per CPU cards with mean and depth plus the
     * running estimate and the pid. Freq unknown
     * stays plain with no zero print. No sibling
     * stays plain with no badge. */
    function renderCoreCards(data) {
      var container = el('core-cards');
      var perCpu = data.per_cpu || [];
      if (!perCpu.length) {
        container.innerHTML = '<div class="card" ' +
          'style="grid-column:1/-1;text-align:center;' +
          'color:var(--text-muted)">' +
          'No CPU data yet</div>';
        return;
      }
      container.innerHTML = perCpu.map(function(cpu) {
        var curMhz = Math.round(
          (cpu.cur_freq_khz || 0) / 1000);
        var maxMhz = Math.round(
          (cpu.freq_khz || 0) / 1000);
        var freqLabel = 'freq unknown';
        if (maxMhz > 0 && curMhz > 0) {
          freqLabel = curMhz + ' of ' +
            maxMhz + ' MHz';
        } else if (maxMhz > 0) {
          freqLabel = maxMhz + ' MHz';
        } else if (curMhz > 0) {
          freqLabel = curMhz + ' MHz';
        }
        var smtLabel = cpu.smt
          ? ' <span class="core-smt">SMT</span>'
          : '';
        var pid = cpu.running_pid || 0;
        var est = cpu.running_est_ns || 0;
        var tq = cpu.tq_ns || 0;
        var depth = cpu.depth || 0;
        var idle = !pid;
        var badge = idle
          ? '<span class="run-badge run-idle">idle</span>'
          : '<span class="run-badge run-live">live</span>';
        var pidLabel = idle
          ? '<div class="core-pid">pid -</div>'
          : '<div class="core-pid">pid ' + pid + '</div>';
        var estLabel = idle
          ? '<div class="core-est">est -</div>'
          : '<div class="core-est">est ' + fmtSlice(est) +
            '</div>';
        var tqLabel = '<div class="core-tq">tq ' +
          fmtSlice(tq) + '</div>';
        var depthLabel = '<div class="core-depth">' +
          'depth ' + fmt(depth) + '</div>';
        var llcLabel = '<div class="core-llc">LLC ' +
          (cpu.llc_id || 0) + '</div>';
        return '<div class="card core-card">' +
          '<div class="core-id">CPU ' + cpu.id +
          smtLabel + '</div>' +
          '<div class="core-freq">' + freqLabel +
          '</div>' + llcLabel +
          '<div>' + badge + '</div>' +
          pidLabel + estLabel + tqLabel + depthLabel +
          '</div>';
      }).join('');
    }

    /* Summary prose, built from the live gauges.
     * The tldr names the running count and the
     * queued total. The explanation walks the
     * insert and move split. */
    function buildSummary(s, perCpu) {
      var onCpu = s.on_cpu || 0;
      var ins = s.inserts || 0;
      var req = s.requeues || 0;
      var done = s.completions || 0;
      var park = s.park_moves || 0;
      var steal = s.steal_moves || 0;
      var total = 0;
      for (var i = 0; i < perCpu.length; i++) {
        total += perCpu[i].depth || 0;
      }
      var placed = ins + req;
      var tldr, explanation;
      if (!placed && !onCpu) {
        tldr = 'Flow is idle and waiting for work.';
        explanation = 'As you can see from the gauges, ' +
          'no tasks have been placed yet. Queues hold ' +
          fmt(total) + ' tasks.';
      } else if (onCpu > 0) {
        tldr = 'Flow is running ' + fmt(onCpu) +
          ' tasks with ' + fmt(total) + ' queued.';
        explanation = 'As you can see from the gauges, ' +
          'joins cover ' + fmt(placed) +
          ' with completions ' + fmt(done) +
          '. Park moves cover ' + fmt(park) +
          ' and steal moves cover ' + fmt(steal) + '.';
      } else {
        tldr = 'Flow placed ' + fmt(placed) +
          ' tasks and is now idle.';
        explanation = 'As you can see from the gauges, ' +
          'joins cover ' + fmt(placed) +
          ' with completions ' + fmt(done) +
          '. Park moves cover ' + fmt(park) +
          ' and steal moves cover ' + fmt(steal) + '.';
      }
      return { tldr: tldr, explanation: explanation };
    }

    function updateUI(data) {
      el('status-badge').textContent = '● running';
      el('status-badge').style.borderColor =
        'var(--success)';
      el('status-badge').style.color = 'var(--success)';

      var s = data.stats || {};
      var perCpu = data.per_cpu || [];
      var summary = buildSummary(s, perCpu);
      el('summary-tldr').textContent = summary.tldr;
      el('summary-explanation').textContent =
        summary.explanation;

      el('on-cpu').textContent = fmt(s.on_cpu || 0);
      el('uptime').textContent =
        fmtRuntime(s.uptime_ns || 0);
      el('runtime').textContent =
        fmtRuntime(s.total_runtime || 0);
      el('inserts').textContent =
        fmt(s.inserts || 0);
      el('requeues').textContent =
        fmt(s.requeues || 0);
      el('completions').textContent =
        fmt(s.completions || 0);
      el('park').textContent =
        fmt(s.park_moves || 0);
      el('steal').textContent =
        fmt(s.steal_moves || 0);
      el('kicks').textContent =
        fmt(s.kicks || 0);
      el('no-tctx').textContent =
        fmt(s.enq_no_tctx || 0);

      renderCoreCards(data);
    }

    function pollStats() {
      fetch('/api/stats', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          updateUI(data);
          el('conn-status').textContent = 'Live at ' +
            new Date().toLocaleTimeString();
        })
        .catch(function() {
          el('status-badge').textContent =
            '● disconnected';
          el('status-badge').style.borderColor =
            'var(--error)';
          el('status-badge').style.color = 'var(--error)';
          el('conn-status').textContent =
            'Disconnected, retrying...';
        });
    }

    pollStats();
    setInterval(pollStats, 1000);
  </script>
</body>
</html>
